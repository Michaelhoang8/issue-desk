<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Issue Desk</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/rest_transport.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body data-app="tickets">
    <header>
      <a class="brand" href="/">Issue Desk</a>
      <nav>
        <button id="activity-open">Activity</button
        ><button id="export">Export JSON</button
        ><button id="create-open" class="primary">+ New issue</button>
      </nav>
    </header>
    <main>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="tickets" class="page">
        <div class="board-title">
          <div>
            <span id="breadcrumb" hidden>Issue Desk</span>
            <h1>Issues</h1>
          </div>
          <div id="ticket-stats" class="stats"></div>
        </div>
        <div class="filter-bar">
          <div class="toolbar">
            <label
              >Find an issue<input
                id="search"
                type="search"
                maxlength="200"
                placeholder="Title, description, assignee, or #ID" /></label
            ><label
              >Priority<select id="priority-filter">
                <option value="">All priorities</option>
                <option>high</option>
                <option>medium</option>
                <option>low</option>
              </select></label
            >
          </div>
          <details id="issue-view-options" class="issue-view-options">
            <summary>View options</summary>
            <div class="two-col">
              <label
                >Due date filter<select id="due-filter">
                  <option value="">Any due date</option>
                  <option value="overdue">Open and overdue</option>
                  <option value="today">Open and due today</option>
                  <option value="unscheduled">Open without a due date</option>
                </select></label
              ><label
                >Issue visibility<select id="issue-archive">
                  <option value="current">Current issues</option>
                  <option value="archived">Archived issues</option>
                  <option value="all">Current and archived</option>
                </select></label
              ><label
                >Order within each column<select id="issue-sort">
                  <option value="newest">Newest first</option>
                  <option value="priority">Highest priority first</option>
                  <option value="due">Earliest due date first</option>
                </select></label
              >
            </div>
          </details>
        </div>
        <div class="filter-feedback">
          <span id="filter-summary" role="status"></span
          ><button id="reset-filters" hidden>Clear filters</button>
        </div>
        <div id="board" class="board"></div>
      </section>
    </main>
    <dialog id="create-dialog" aria-label="Create an issue">
      <button
        id="create-close"
        class="dialog-close"
        aria-label="Close new issue"
      >
        ×
      </button>
      <form id="ticket-form" class="panel">
        <h2>Create an issue</h2>
        <label
          >Title<input
            name="title"
            required
            maxlength="200"
            placeholder="What needs to happen?" /></label
        ><label
          >Description<textarea
            name="description"
            required
            maxlength="4000"
            placeholder="Context and acceptance criteria"
          ></textarea></label
        ><label
          >Priority<select name="priority">
            <option>medium</option>
            <option>high</option>
            <option>low</option>
          </select></label
        ><label
          >Assignee<input
            name="assignee"
            maxlength="120"
            placeholder="Name or team (optional)" /></label
        ><label>Due date<input name="due_date" type="date" /></label
        ><button class="primary">Create issue</button>
      </form>
    </dialog>
    <dialog id="activity-dialog" aria-label="Recent activity">
      <div class="section-head">
        <h2>Recent activity</h2>
        <button
          id="activity-close"
          class="dialog-close"
          aria-label="Close activity"
        >
          ×
        </button>
      </div>
      <div id="activity"></div>
      <a
        class="audit-link"
        href="/api/issues-audit.csv"
        download="issue-audit.csv"
        >Export audit CSV</a
      >
    </dialog>
  </body>
</html>
